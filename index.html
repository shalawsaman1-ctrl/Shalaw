<!doctype html><html lang="ku"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHALAW</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:700px;margin:auto;padding:20px 16px 60px}.logo{font-size:32px;font-weight:800;background:linear-gradient(90deg,#7c5cff,#20d9ff);-webkit-background-clip:text;color:transparent}input,textarea{width:100%;box-sizing:border-box;background:#11182b;border:1px solid #293452;color:#fff;border-radius:14px;padding:13px;margin:7px 0;font-size:16px}button{border:0;border-radius:13px;padding:11px 15px;background:#7057ff;color:#fff;font-weight:700;margin:5px 3px}.card{background:#12182b;border:1px solid #26304b;border-radius:19px;padding:16px;margin:12px 0}.muted{color:#9aa5c3;font-size:13px}.ans{padding:10px 0;border-top:1px solid #27304a;margin-top:10px}.top{display:flex;justify-content:space-between;align-items:center}.hidden{display:none}</style></head><body><div class="wrap"><div class="top"><div class="logo">SHALAW</div><button onclick="logout()">دەرچوون</button></div><section id="auth"><h2>بەخێربێیت 👋</h2><input id="name" placeholder="ناوت"><input id="email" placeholder="ئیمەیڵ"><button onclick="signup()">دروستکردنی هەژمار</button></section><section id="app" class="hidden"><h2>پرسیارێکت هەیە؟ 🤔</h2><textarea id="q" placeholder="پرسیارەکەت بنووسە..."></textarea><button onclick="ask()">بڵاوی بکەرەوە</button><div id="list"></div></section></div><script>
let me=JSON.parse(localStorage.me||'null'); const $=id=>document.getElementById(id); function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function signup(){let r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value})});let x=await r.json();if(!r.ok)return alert(x.error);localStorage.me=JSON.stringify(x);me=x;boot()}
function logout(){localStorage.removeItem('me');me=null;boot()} function boot(){ $('auth').classList.toggle('hidden',!!me);$('app').classList.toggle('hidden',!me);if(me)load()}
async function ask(){let text=$('q').value.trim();if(!text)return;await fetch('/api/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:me.id,text})});$('q').value='';load()}
async function like(id){await fetch('/api/questions/'+id+'/like',{method:'POST'});load()}
async function answer(id){let t=prompt('وەڵامەکەت بنووسە');if(!t)return;await fetch('/api/questions/'+id+'/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:me.id,text:t})});load()}
async function load(){let d=await (await fetch('/api/data')).json();$('list').innerHTML=d.questions.map(q=>{let u=d.users.find(x=>x.id===q.userId),aa=d.answers.filter(a=>a.questionId===q.id);return `<div class="card"><b>❓ ${esc(q.text)}</b><div class="muted">${esc(u?.name||'بەکارهێنەر')}</div><button onclick="like('${q.id}')">❤️ ${q.likes}</button><button onclick="answer('${q.id}')">💬 وەڵام</button>${aa.map(a=>{let au=d.users.find(x=>x.id===a.userId);return `<div class="ans"><b>${esc(au?.name||'بەکارهێنەر')}:</b> ${esc(a.text)}</div>`}).join('')}</div>`}).join('')||'<p class="muted">هێشتا پرسیارێک نییە.</p>'}
boot();
</script></body></html>
